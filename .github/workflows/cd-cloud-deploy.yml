name: CD Cloud Deploy

on:
  workflow_dispatch:
    inputs:
      promote_to_production:
        description: "Create production rollout after staging"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: cd-cloud-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      AR_HOSTNAME: ${{ vars.ARTIFACT_REGISTRY_HOSTNAME || 'us-docker.pkg.dev' }}
      AR_REPOSITORY: ${{ vars.ARTIFACT_REGISTRY_REPOSITORY || 'antigravity' }}
      IMAGE_NAME: ${{ vars.CLOUD_RUN_IMAGE_NAME || 'dashboard-api' }}
      FRONTEND_IMAGE_NAME: ${{ vars.CLOUD_RUN_FRONTEND_IMAGE_NAME || 'agent-dashboard' }}
      CLOUD_DEPLOY_PIPELINE: ${{ vars.CLOUD_DEPLOY_PIPELINE || 'dashboard-api' }}
      CLOUD_DEPLOY_PIPELINE_FRONTEND: ${{ vars.CLOUD_DEPLOY_PIPELINE_FRONTEND || 'agent-dashboard' }}
      CLOUD_RUN_SERVICE_STAGING: ${{ vars.CLOUD_RUN_SERVICE_STAGING }}
      CLOUD_RUN_SERVICE_PRODUCTION: ${{ vars.CLOUD_RUN_SERVICE_PRODUCTION }}
      CLOUD_RUN_SERVICE_FRONTEND_STAGING: ${{ vars.CLOUD_RUN_SERVICE_FRONTEND_STAGING || 'agent-dashboard-staging' }}
      CLOUD_RUN_SERVICE_FRONTEND_PRODUCTION: ${{ vars.CLOUD_RUN_SERVICE_FRONTEND_PRODUCTION || 'agent-dashboard-production' }}
      BACKEND_URL_STAGING: ${{ vars.BACKEND_URL_STAGING || '' }}
      BACKEND_URL_PRODUCTION: ${{ vars.BACKEND_URL_PRODUCTION || '' }}
      PROMOTE_TO_PRODUCTION: ${{ github.event_name == 'workflow_dispatch' && inputs.promote_to_production || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate required configuration
        shell: bash
        run: |
          set -euo pipefail

          required_vars=(
            GCP_PROJECT_ID
            GCP_REGION
            CLOUD_RUN_SERVICE_STAGING
            CLOUD_RUN_SERVICE_PRODUCTION
          )

          for key in "${required_vars[@]}"; do
            if [[ -z "${!key}" ]]; then
              echo "Missing repo variable: ${key}"
              exit 1
            fi
          done

          if [[ -z "${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}" ]]; then
            echo "Missing secret: GCP_WORKLOAD_IDENTITY_PROVIDER"
            exit 1
          fi

          if [[ -z "${{ secrets.GCP_SERVICE_ACCOUNT }}" ]]; then
            echo "Missing secret: GCP_SERVICE_ACCOUNT"
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: ./.github/actions/gcp-auth-setup
        with:
          gcp_project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Build and push backend image with Cloud Build
        id: build
        uses: ./.github/actions/gcp-build-image
        with:
          gcp_project_id: ${{ env.GCP_PROJECT_ID }}
          ar_hostname: ${{ env.AR_HOSTNAME }}
          ar_repository: ${{ env.AR_REPOSITORY }}
          image_name: ${{ env.IMAGE_NAME }}

      - name: Build and push frontend image with Cloud Build
        id: build-frontend
        uses: ./.github/actions/gcp-build-image
        with:
          gcp_project_id: ${{ env.GCP_PROJECT_ID }}
          ar_hostname: ${{ env.AR_HOSTNAME }}
          ar_repository: ${{ env.AR_REPOSITORY }}
          image_name: ${{ env.FRONTEND_IMAGE_NAME }}
          cloudbuild_config: cloudbuild/release-frontend.yaml

      - name: Render Cloud Deploy configs
        id: render
        shell: bash
        run: |
          set -euo pipefail

          # --- Backend pipeline ---
          backend_dir="${RUNNER_TEMP}/clouddeploy-backend"
          mkdir -p "${backend_dir}"

          cp clouddeploy/pipeline.yaml "${backend_dir}/pipeline.yaml"
          cp clouddeploy/skaffold.yaml "${backend_dir}/skaffold.yaml"
          cp clouddeploy/service-staging.yaml "${backend_dir}/service-staging.yaml"
          cp clouddeploy/service-production.yaml "${backend_dir}/service-production.yaml"

          sed -i "s|__PIPELINE_NAME__|${CLOUD_DEPLOY_PIPELINE}|g" "${backend_dir}/pipeline.yaml"
          sed -i "s|__PROJECT_ID__|${GCP_PROJECT_ID}|g" "${backend_dir}/pipeline.yaml"
          sed -i "s|__REGION__|${GCP_REGION}|g" "${backend_dir}/pipeline.yaml"
          sed -i "s|__SERVICE_STAGING__|${CLOUD_RUN_SERVICE_STAGING}|g" "${backend_dir}/service-staging.yaml"
          sed -i "s|__SERVICE_PRODUCTION__|${CLOUD_RUN_SERVICE_PRODUCTION}|g" "${backend_dir}/service-production.yaml"

          # --- Frontend pipeline ---
          frontend_dir="${RUNNER_TEMP}/clouddeploy-frontend"
          mkdir -p "${frontend_dir}"

          cp clouddeploy/pipeline-frontend.yaml "${frontend_dir}/pipeline.yaml"
          cp clouddeploy/skaffold-frontend.yaml "${frontend_dir}/skaffold.yaml"
          cp clouddeploy/frontend-staging.yaml "${frontend_dir}/frontend-staging.yaml"
          cp clouddeploy/frontend-production.yaml "${frontend_dir}/frontend-production.yaml"

          sed -i "s|__PIPELINE_FRONTEND_NAME__|${CLOUD_DEPLOY_PIPELINE_FRONTEND}|g" "${frontend_dir}/pipeline.yaml"
          sed -i "s|__PROJECT_ID__|${GCP_PROJECT_ID}|g" "${frontend_dir}/pipeline.yaml"
          sed -i "s|__REGION__|${GCP_REGION}|g" "${frontend_dir}/pipeline.yaml"
          sed -i "s|__SERVICE_FRONTEND_STAGING__|${CLOUD_RUN_SERVICE_FRONTEND_STAGING}|g" "${frontend_dir}/frontend-staging.yaml"
          sed -i "s|__SERVICE_FRONTEND_PRODUCTION__|${CLOUD_RUN_SERVICE_FRONTEND_PRODUCTION}|g" "${frontend_dir}/frontend-production.yaml"
          sed -i "s|__BACKEND_URL_STAGING__|${BACKEND_URL_STAGING}|g" "${frontend_dir}/frontend-staging.yaml"
          sed -i "s|__BACKEND_URL_PRODUCTION__|${BACKEND_URL_PRODUCTION}|g" "${frontend_dir}/frontend-production.yaml"

          echo "backend_dir=${backend_dir}" >> "${GITHUB_OUTPUT}"
          echo "frontend_dir=${frontend_dir}" >> "${GITHUB_OUTPUT}"

      - name: Create backend Cloud Deploy release
        id: release-backend
        shell: bash
        run: |
          set -euo pipefail
          gcloud config set project "${GCP_PROJECT_ID}"

          release_name="rel-${GITHUB_SHA::8}-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"

          gcloud deploy releases create "${release_name}" \
            --delivery-pipeline "${CLOUD_DEPLOY_PIPELINE}" \
            --region "${GCP_REGION}" \
            --skaffold-file "${{ steps.render.outputs.backend_dir }}/skaffold.yaml" \
            --source "${{ steps.render.outputs.backend_dir }}" \
            --images "dashboard-image=${{ steps.build.outputs.image_uri }}"

          echo "release_name=${release_name}" >> "${GITHUB_OUTPUT}"

      - name: Create frontend Cloud Deploy release
        id: release-frontend
        shell: bash
        run: |
          set -euo pipefail
          gcloud config set project "${GCP_PROJECT_ID}"

          release_name="fe-${GITHUB_SHA::8}-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"

          gcloud deploy releases create "${release_name}" \
            --delivery-pipeline "${CLOUD_DEPLOY_PIPELINE_FRONTEND}" \
            --region "${GCP_REGION}" \
            --skaffold-file "${{ steps.render.outputs.frontend_dir }}/skaffold.yaml" \
            --source "${{ steps.render.outputs.frontend_dir }}" \
            --images "frontend-image=${{ steps.build-frontend.outputs.image_uri }}"

          echo "release_name=${release_name}" >> "${GITHUB_OUTPUT}"

      - name: Wait for backend staging rollout
        shell: bash
        run: |
          set -euo pipefail
          gcloud config set project "${GCP_PROJECT_ID}"

          release_name="${{ steps.release-backend.outputs.release_name }}"
          pipeline="${CLOUD_DEPLOY_PIPELINE}"
          timeout_seconds=900
          elapsed=0

          while [[ "${elapsed}" -lt "${timeout_seconds}" ]]; do
            rollout_name="$(gcloud deploy rollouts list \
              --delivery-pipeline "${pipeline}" \
              --release "${release_name}" \
              --region "${GCP_REGION}" \
              --filter "targetId=staging" \
              --sort-by "~createTime" \
              --limit 1 \
              --format "value(name)")"

            if [[ -z "${rollout_name}" ]]; then
              sleep 5
              elapsed=$((elapsed + 5))
              continue
            fi

            rollout_id="${rollout_name##*/}"

            rollout_state="$(gcloud deploy rollouts describe "${rollout_id}" \
              --delivery-pipeline "${pipeline}" \
              --release "${release_name}" \
              --region "${GCP_REGION}" \
              --format "value(state)")"

            case "${rollout_state}" in
              SUCCEEDED)
                echo "Backend staging rollout succeeded: ${rollout_name}"
                exit 0
                ;;
              FAILED|CANCELLED)
                echo "Backend staging rollout failed with state ${rollout_state}: ${rollout_name}"
                exit 1
                ;;
              *)
                echo "Backend staging rollout state: ${rollout_state}"
                sleep 10
                elapsed=$((elapsed + 10))
                ;;
            esac
          done

          echo "Timed out waiting for backend staging rollout."
          exit 1

      - name: Wait for frontend staging rollout
        shell: bash
        run: |
          set -euo pipefail
          gcloud config set project "${GCP_PROJECT_ID}"

          release_name="${{ steps.release-frontend.outputs.release_name }}"
          pipeline="${CLOUD_DEPLOY_PIPELINE_FRONTEND}"
          timeout_seconds=900
          elapsed=0

          while [[ "${elapsed}" -lt "${timeout_seconds}" ]]; do
            rollout_name="$(gcloud deploy rollouts list \
              --delivery-pipeline "${pipeline}" \
              --release "${release_name}" \
              --region "${GCP_REGION}" \
              --filter "targetId=staging" \
              --sort-by "~createTime" \
              --limit 1 \
              --format "value(name)")"

            if [[ -z "${rollout_name}" ]]; then
              sleep 5
              elapsed=$((elapsed + 5))
              continue
            fi

            rollout_id="${rollout_name##*/}"

            rollout_state="$(gcloud deploy rollouts describe "${rollout_id}" \
              --delivery-pipeline "${pipeline}" \
              --release "${release_name}" \
              --region "${GCP_REGION}" \
              --format "value(state)")"

            case "${rollout_state}" in
              SUCCEEDED)
                echo "Frontend staging rollout succeeded: ${rollout_name}"
                exit 0
                ;;
              FAILED|CANCELLED)
                echo "Frontend staging rollout failed with state ${rollout_state}: ${rollout_name}"
                exit 1
                ;;
              *)
                echo "Frontend staging rollout state: ${rollout_state}"
                sleep 10
                elapsed=$((elapsed + 10))
                ;;
            esac
          done

          echo "Timed out waiting for frontend staging rollout."
          exit 1

      - name: Promote releases to production target
        if: ${{ env.PROMOTE_TO_PRODUCTION == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          gcloud config set project "${GCP_PROJECT_ID}"

          gcloud deploy releases promote \
            --delivery-pipeline "${CLOUD_DEPLOY_PIPELINE}" \
            --release "${{ steps.release-backend.outputs.release_name }}" \
            --region "${GCP_REGION}" \
            --to-target production

          gcloud deploy releases promote \
            --delivery-pipeline "${CLOUD_DEPLOY_PIPELINE_FRONTEND}" \
            --release "${{ steps.release-frontend.outputs.release_name }}" \
            --region "${GCP_REGION}" \
            --to-target production

          echo "Production rollouts created. Approval is still required on Cloud Deploy targets."

      - name: Summary
        shell: bash
        run: |
          echo "Backend release:   ${{ steps.release-backend.outputs.release_name }}"
          echo "Backend image:     ${{ steps.build.outputs.image_uri }}"
          echo "Frontend release:  ${{ steps.release-frontend.outputs.release_name }}"
          echo "Frontend image:    ${{ steps.build-frontend.outputs.image_uri }}"
          echo "Backend pipeline:  ${CLOUD_DEPLOY_PIPELINE}"
          echo "Frontend pipeline: ${CLOUD_DEPLOY_PIPELINE_FRONTEND}"
          echo "Region:            ${GCP_REGION}"
