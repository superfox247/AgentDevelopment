name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      run_docker_e2e:
        description: "Run Docker-stack E2E job"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run linting (Ruff)
        run: uv run ruff check .

      - name: Run type checking (MyPy)
        run: uv run mypy dashboard_api

      - name: Check generated docs drift
        run: uv run python scripts/generate_reference_docs.py --check

  test:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run unit tests with coverage
        run: >-
          uv run pytest
          --cov=agent_platform
          --cov=agents
          --cov=dashboard_api
          --cov-report=xml
          --cov-report=term-missing
          --junitxml=pytest-report.xml
          -v

      - name: Verify agent discovery
        run: |
          echo "Verifying agent registry can discover researcher_agent..."
          uv run python -c "
          from pathlib import Path
          from dashboard_api.utils.agent_registry import AgentRegistry
          registry = AgentRegistry(Path('agents'))
          agents = registry.get_agents(refresh=True)
          agent_names = [a.name for a in agents]
          assert 'researcher_agent' in agent_names, f'researcher_agent not found. Found: {agent_names}'
          metadata = registry.get_agent('researcher_agent')
          assert metadata is not None, 'researcher_agent metadata is None'
          assert metadata.has_server, 'researcher_agent should have server.py'
          print(f'Agent discovery verified: {agent_names}')
          "

      - name: Upload backend test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-artifacts
          path: |
            coverage.xml
            pytest-report.xml
          if-no-files-found: ignore

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser + OS deps
        run: pnpm exec playwright install --with-deps chromium

      - name: Run TypeScript check
        run: pnpm exec tsc --noEmit

      - name: Run lint
        run: pnpm lint

      - name: Run component tests
        run: pnpm test run

      - name: Run E2E tests (dev server)
        run: pnpm test:e2e

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-frontend
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore

  e2e-docker:
    name: E2E Tests (Docker Stack)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_docker_e2e }}
    runs-on: ubuntu-latest
    needs: [quality, test, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser + OS deps
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Build frontend
        working-directory: frontend
        run: pnpm build

      - name: Build Docker images
        run: docker compose build

      - name: Start Docker stack
        run: docker compose up -d

      - name: Wait for Docker services to be healthy
        run: |
          timeout=120
          elapsed=0

          while [ "$elapsed" -lt "$timeout" ]; do
            ps_output="$(docker compose ps)"

            if echo "$ps_output" | grep -qi "Exit"; then
              echo "A container exited unexpectedly."
              echo "$ps_output"
              docker compose logs --tail=100
              exit 1
            fi

            if echo "$ps_output" | grep -qi "unhealthy"; then
              echo "A container became unhealthy."
              echo "$ps_output"
              docker compose logs --tail=100
              exit 1
            fi

            if echo "$ps_output" | grep -qi "starting"; then
              sleep 2
              elapsed=$((elapsed + 2))
              echo -n "."
              continue
            fi

            if echo "$ps_output" | grep -qi "running\|healthy"; then
              echo "Docker services are ready"
              docker compose ps
              exit 0
            fi

            sleep 2
            elapsed=$((elapsed + 2))
            echo -n "."
          done

          echo "Timeout waiting for services after ${timeout}s"
          docker compose ps
          docker compose logs --tail=100
          exit 1

      - name: Start dashboard API
        run: |
          uv run python dashboard_api/server.py &
          echo $! > api.pid
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'test-key' }}

      - name: Wait for dashboard API
        run: |
          timeout=30
          elapsed=0
          while [ "$elapsed" -lt "$timeout" ]; do
            if curl -f http://localhost:8010/health >/dev/null 2>&1; then
              echo "Dashboard API is ready"
              exit 0
            fi
            sleep 1
            elapsed=$((elapsed + 1))
          done
          echo "Dashboard API failed to start"
          exit 1

      - name: Serve frontend (preview mode)
        working-directory: frontend
        run: |
          pnpm preview --port 5173 --host &
          echo $! > preview.pid
          sleep 5

      - name: Run E2E tests against Docker stack
        working-directory: frontend
        run: pnpm exec playwright test --config=playwright.docker.config.ts
        env:
          CI: true

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-docker
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore

      - name: Show Docker logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --tail=200

      - name: Cleanup
        if: always()
        run: |
          docker compose down -v
          if [ -f api.pid ]; then kill $(cat api.pid) 2>/dev/null || true; fi
          if [ -f preview.pid ]; then kill $(cat preview.pid) 2>/dev/null || true; fi
