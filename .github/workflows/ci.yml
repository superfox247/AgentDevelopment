name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run Linting (Ruff)
        run: uv run ruff check .

      - name: Run Type Checking (MyPy)
        run: uv run mypy .

  test:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run Unit Tests with Coverage
        run: uv run pytest --cov=agent_platform --cov=agents --cov=dashboard_api.routers --cov=dashboard_api.utils --cov=dashboard_api --cov-report=xml --cov-report=term-missing -v

      - name: Verify Agent Discovery
        run: |
          echo "Verifying agent registry can discover researcher_agent..."
          uv run python -c "
          from pathlib import Path
          from dashboard_api.utils.agent_registry import AgentRegistry
          registry = AgentRegistry(Path('agents'))
          agents = registry.get_agents(refresh=True)
          agent_names = [a.name for a in agents]
          assert 'researcher_agent' in agent_names, f'researcher_agent not found. Found: {agent_names}'
          metadata = registry.get_agent('researcher_agent')
          assert metadata is not None, 'researcher_agent metadata is None'
          assert metadata.has_server, 'researcher_agent should have server.py'
          print(f'✅ Agent discovery verified: {agent_names}')
          "

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      - name: Run TypeScript Check
        run: pnpm exec tsc --noEmit

      - name: Run Lint
        run: pnpm lint

      - name: Run Component Tests
        run: pnpm test run

      - name: Run E2E Tests (Dev Server)
        run: pnpm test:e2e
        continue-on-error: true  # E2E tests may require Docker, allow to fail gracefully

  e2e-docker:
    name: E2E Tests (Docker Stack)
    runs-on: ubuntu-latest
    needs: [quality, test, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install

      - name: Build frontend
        working-directory: frontend
        run: pnpm build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker images
        run: docker compose build

      - name: Start Docker stack
        run: docker compose up -d

      - name: Show initial container status
        run: |
          echo "📋 Initial container status:"
          docker compose ps
          echo ""
          echo "📋 Recent logs (last 20 lines):"
          docker compose logs --tail=20

      - name: Wait for Docker services to be healthy
        run: |
          timeout=120
          elapsed=0
          log_interval=30
          last_log_time=0
          
          while [ $elapsed -lt $timeout ]; do
            # Show logs periodically
            if [ $((elapsed - last_log_time)) -ge $log_interval ] || [ $elapsed -lt 10 ]; then
              echo ""
              echo "📋 Status update (elapsed: ${elapsed}s)..."
              docker compose ps
              echo ""
              echo "📋 Recent logs:"
              docker compose logs --tail=15
              echo ""
              last_log_time=$elapsed
            fi
            
            # Check health
            if docker compose ps | grep -q "healthy\|running" && \
               curl -f http://localhost:8010/health >/dev/null 2>&1; then
              echo "✅ Services are healthy!"
              echo ""
              echo "📋 Final container status:"
              docker compose ps
              exit 0
            fi
            
            sleep 2
            elapsed=$((elapsed + 2))
            echo -n "."
          done
          
          echo ""
          echo "❌ Timeout waiting for services after ${timeout}s"
          echo ""
          echo "📋 Final container status:"
          docker compose ps
          echo ""
          echo "📋 Full logs for debugging:"
          docker compose logs --tail=100
          exit 1

      - name: Start Dashboard API
        run: |
          uv run python dashboard_api/server.py &
          echo $! > api.pid
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'test-key' }}

      - name: Wait for Dashboard API
        run: |
          timeout=30
          elapsed=0
          while [ $elapsed -lt $timeout ]; do
            if curl -f http://localhost:8010/health >/dev/null 2>&1; then
              echo "✅ Dashboard API is ready"
              exit 0
            fi
            sleep 1
            elapsed=$((elapsed + 1))
          done
          echo "❌ Dashboard API failed to start"
          exit 1

      - name: Serve frontend (preview mode)
        working-directory: frontend
        run: |
          pnpm preview --port 5173 --host &
          echo $! > preview.pid
          sleep 5

      - name: Run E2E tests against Docker stack
        working-directory: frontend
        run: pnpm exec playwright test --config=playwright.docker.config.ts
        env:
          CI: true

      - name: Show Docker logs on failure
        if: failure()
        run: |
          echo "📋 Container status:"
          docker compose ps
          echo ""
          echo "📋 Full logs from all services:"
          docker compose logs --tail=200
          echo ""
          echo "📋 Logs by service:"
          docker compose ps --format "{{.Service}}" | while read service; do
            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "Service: $service"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            docker compose logs --tail=50 "$service" || true
          done

      - name: Cleanup
        if: always()
        run: |
          docker compose down -v
          if [ -f api.pid ]; then kill $(cat api.pid) 2>/dev/null || true; fi
          if [ -f preview.pid ]; then kill $(cat preview.pid) 2>/dev/null || true; fi
