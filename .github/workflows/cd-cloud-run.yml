name: CD Cloud Run

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Deployment target"
        required: false
        type: choice
        default: staging
        options:
          - staging
          - production

permissions:
  contents: read
  id-token: write

concurrency:
  group: cd-cloud-run-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-image:
    runs-on: ubuntu-latest
    outputs:
      image_uri: ${{ steps.meta.outputs.image_uri }}
      deploy_target: ${{ steps.meta.outputs.deploy_target }}
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      AR_HOSTNAME: ${{ vars.ARTIFACT_REGISTRY_HOSTNAME || 'us-docker.pkg.dev' }}
      AR_REPOSITORY: ${{ vars.ARTIFACT_REGISTRY_REPOSITORY || 'antigravity' }}
      IMAGE_NAME: ${{ vars.CLOUD_RUN_IMAGE_NAME || 'dashboard-api' }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate required configuration
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${GCP_PROJECT_ID}" ]]; then
            echo "Missing repo variable: GCP_PROJECT_ID"
            exit 1
          fi

          if [[ -z "${GCP_REGION}" ]]; then
            echo "Missing repo variable: GCP_REGION"
            exit 1
          fi

          if [[ -z "${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}" ]]; then
            echo "Missing secret: GCP_WORKLOAD_IDENTITY_PROVIDER"
            exit 1
          fi

          if [[ -z "${{ secrets.GCP_SERVICE_ACCOUNT }}" ]]; then
            echo "Missing secret: GCP_SERVICE_ACCOUNT"
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build and push image with Cloud Build
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          gcloud config set project "${GCP_PROJECT_ID}"

          IMAGE_TAG="${GITHUB_SHA}"
          IMAGE_URI="${AR_HOSTNAME}/${GCP_PROJECT_ID}/${AR_REPOSITORY}/${IMAGE_NAME}:${IMAGE_TAG}"

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            DEPLOY_TARGET="${{ inputs.target }}"
          else
            DEPLOY_TARGET="staging"
          fi

          gcloud builds submit \
            --config cloudbuild/release-dashboard.yaml \
            --substitutions="_AR_HOSTNAME=${AR_HOSTNAME},_AR_REPOSITORY=${AR_REPOSITORY},_IMAGE_NAME=${IMAGE_NAME},_IMAGE_TAG=${IMAGE_TAG}" \
            .

          echo "image_uri=${IMAGE_URI}" >> "${GITHUB_OUTPUT}"
          echo "deploy_target=${DEPLOY_TARGET}" >> "${GITHUB_OUTPUT}"

  deploy-staging:
    runs-on: ubuntu-latest
    needs: build-image
    if: ${{ needs.build-image.outputs.deploy_target == 'staging' || needs.build-image.outputs.deploy_target == 'production' }}
    environment: staging
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      CLOUD_RUN_SERVICE_STAGING: ${{ vars.CLOUD_RUN_SERVICE_STAGING }}
    steps:
      - name: Validate required configuration
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${CLOUD_RUN_SERVICE_STAGING}" ]]; then
            echo "Missing repo variable: CLOUD_RUN_SERVICE_STAGING"
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run (staging)
        shell: bash
        run: |
          set -euo pipefail
          gcloud config set project "${GCP_PROJECT_ID}"

          gcloud run deploy "${CLOUD_RUN_SERVICE_STAGING}" \
            --image "${{ needs.build-image.outputs.image_uri }}" \
            --region "${GCP_REGION}" \
            --platform managed \
            --allow-unauthenticated \
            --quiet

  deploy-production:
    runs-on: ubuntu-latest
    needs: [build-image, deploy-staging]
    if: ${{ needs.build-image.outputs.deploy_target == 'production' }}
    environment: production
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      CLOUD_RUN_SERVICE_PRODUCTION: ${{ vars.CLOUD_RUN_SERVICE_PRODUCTION }}
    steps:
      - name: Validate required configuration
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${CLOUD_RUN_SERVICE_PRODUCTION}" ]]; then
            echo "Missing repo variable: CLOUD_RUN_SERVICE_PRODUCTION"
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run (production)
        shell: bash
        run: |
          set -euo pipefail
          gcloud config set project "${GCP_PROJECT_ID}"

          gcloud run deploy "${CLOUD_RUN_SERVICE_PRODUCTION}" \
            --image "${{ needs.build-image.outputs.image_uri }}" \
            --region "${GCP_REGION}" \
            --platform managed \
            --allow-unauthenticated \
            --quiet
