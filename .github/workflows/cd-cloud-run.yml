name: CD Cloud Run Emergency

on:
  workflow_dispatch:
    inputs:
      emergency_reason:
        description: "Why Cloud Deploy is being bypassed"
        required: true
        type: string
      target:
        description: "Deployment target"
        required: false
        type: choice
        default: staging
        options:
          - staging
          - production

permissions:
  contents: read
  id-token: write

concurrency:
  group: cd-cloud-run-emergency-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-image:
    runs-on: ubuntu-latest
    outputs:
      image_uri: ${{ steps.meta.outputs.image_uri }}
      deploy_target: ${{ steps.meta.outputs.deploy_target }}
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      AR_HOSTNAME: ${{ vars.ARTIFACT_REGISTRY_HOSTNAME || 'us-docker.pkg.dev' }}
      AR_REPOSITORY: ${{ vars.ARTIFACT_REGISTRY_REPOSITORY || 'antigravity' }}
      IMAGE_NAME: ${{ vars.CLOUD_RUN_IMAGE_NAME || 'dashboard-api' }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate required configuration
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${GCP_PROJECT_ID}" ]]; then
            echo "Missing repo variable: GCP_PROJECT_ID"
            exit 1
          fi

          if [[ -z "${GCP_REGION}" ]]; then
            echo "Missing repo variable: GCP_REGION"
            exit 1
          fi

          if [[ -z "${{ inputs.emergency_reason }}" ]]; then
            echo "Missing required input: emergency_reason"
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: ./.github/actions/gcp-auth-setup
        with:
          gcp_project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Build and push image with Cloud Build
        id: build
        uses: ./.github/actions/gcp-build-image
        with:
          gcp_project_id: ${{ env.GCP_PROJECT_ID }}
          ar_hostname: ${{ env.AR_HOSTNAME }}
          ar_repository: ${{ env.AR_REPOSITORY }}
          image_name: ${{ env.IMAGE_NAME }}

      - name: Resolve deployment metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          echo "image_uri=${{ steps.build.outputs.image_uri }}" >> "${GITHUB_OUTPUT}"
          echo "deploy_target=${{ inputs.target }}" >> "${GITHUB_OUTPUT}"

      - name: Summary
        shell: bash
        run: |
          echo "Emergency reason: ${{ inputs.emergency_reason }}"
          echo "Deploy target:   ${{ inputs.target }}"
          echo "Image:           ${{ steps.build.outputs.image_uri }}"

  deploy-staging:
    runs-on: ubuntu-latest
    needs: build-image
    if: ${{ needs.build-image.outputs.deploy_target == 'staging' || needs.build-image.outputs.deploy_target == 'production' }}
    environment: staging
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      CLOUD_RUN_SERVICE_STAGING: ${{ vars.CLOUD_RUN_SERVICE_STAGING }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate required configuration
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${CLOUD_RUN_SERVICE_STAGING}" ]]; then
            echo "Missing repo variable: CLOUD_RUN_SERVICE_STAGING"
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: ./.github/actions/gcp-auth-setup
        with:
          gcp_project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Deploy to Cloud Run (staging)
        shell: bash
        run: |
          set -euo pipefail
          gcloud run deploy "${CLOUD_RUN_SERVICE_STAGING}" \
            --image "${{ needs.build-image.outputs.image_uri }}" \
            --region "${GCP_REGION}" \
            --platform managed \
            --allow-unauthenticated \
            --quiet

  deploy-production:
    runs-on: ubuntu-latest
    needs: [build-image, deploy-staging]
    if: ${{ needs.build-image.outputs.deploy_target == 'production' }}
    environment: production
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      CLOUD_RUN_SERVICE_PRODUCTION: ${{ vars.CLOUD_RUN_SERVICE_PRODUCTION }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate required configuration
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${CLOUD_RUN_SERVICE_PRODUCTION}" ]]; then
            echo "Missing repo variable: CLOUD_RUN_SERVICE_PRODUCTION"
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: ./.github/actions/gcp-auth-setup
        with:
          gcp_project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Deploy to Cloud Run (production)
        shell: bash
        run: |
          set -euo pipefail
          gcloud run deploy "${CLOUD_RUN_SERVICE_PRODUCTION}" \
            --image "${{ needs.build-image.outputs.image_uri }}" \
            --region "${GCP_REGION}" \
            --platform managed \
            --allow-unauthenticated \
            --quiet
