[project]
name = "image_generator"
version = "0.1.0"
description = "Course Creator Image Generator Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-genai",
    "pillow",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
