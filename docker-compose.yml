services:
  # --- UI & Brain ---
  orchestrator:
    container_name: course_creator-orchestrator
    build:
      context: .
      dockerfile: agent_platform/Dockerfile.agent
      args:
        AGENT_PATH: domains/course_creator/orchestrator
    ports:
      - "8000:8080"
    environment:
      - GOOGLE_GENAI_USE_VERTEXAI=${GOOGLE_GENAI_USE_VERTEXAI}
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT}
      - GOOGLE_CLOUD_LOCATION=${GOOGLE_CLOUD_LOCATION}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - RESEARCHER_AGENT_CARD_URL=http://researcher:8080/.well-known/agent.json
      - JUDGE_AGENT_CARD_URL=http://judge:8080/.well-known/agent.json
      - CONTENT_BUILDER_AGENT_CARD_URL=http://content_builder:8080/.well-known/agent.json
      - CUSTOMER_SERVICE_AGENT_CARD_URL=http://customer_service:8080/.well-known/agent.json
      - PHOENIX_COLLECTOR_ENDPOINT=http://phoenix:6006/v1/traces
      - OTEL_SERVICE_NAME=course-creation-orchestrator
    volumes:
      - ./domains/course_creator/orchestrator:/app/orchestrator
      - ./.env:/app/.env
      - ./agent_platform:/app/agent_platform
      - ./registry:/app/registry
      - ./.agent:/app/.agent
      - ./artifacts:/app/artifacts
    command: [ "/bin/sh", "-c", "adk web . --host 0.0.0.0 --port 8080; sleep infinity" ]
    depends_on:
      - researcher
      - judge
      - content_builder
      - image_generator
      - customer_service
      - phoenix

  # --- Worker Microservices ---
  # Each agent exposes port 8000 inside its container for standard ADK discovery

  researcher:
    container_name: course_creator-researcher
    build:
      context: .
      dockerfile: agent_platform/Dockerfile.agent
      args:
        AGENT_PATH: domains/course_creator/researcher
    ports:
      - "8001:8080" # Map 8001 on host to 8080 in container
    environment:
      - PORT=8080
      - AGENT_HOST=researcher
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GOOGLE_GENAI_USE_VERTEXAI=${GOOGLE_GENAI_USE_VERTEXAI}
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT}
      - GOOGLE_CLOUD_LOCATION=${GOOGLE_CLOUD_LOCATION}
      - PHOENIX_COLLECTOR_ENDPOINT=http://phoenix:6006/v1/traces
    volumes:
      - ./domains/course_creator/researcher:/app/orchestrator
      - ./.env:/app/.env
      - ./agent_platform:/app/agent_platform
      - ./registry:/app/registry
      - ./.agent:/app/.agent

  judge:
    container_name: course_creator-judge
    build:
      context: .
      dockerfile: agent_platform/Dockerfile.agent
      args:
        AGENT_PATH: domains/course_creator/judge
    ports:
      - "8002:8080"
    environment:
      - PORT=8080
      - AGENT_HOST=judge
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GOOGLE_GENAI_USE_VERTEXAI=${GOOGLE_GENAI_USE_VERTEXAI}
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT}
      - GOOGLE_CLOUD_LOCATION=${GOOGLE_CLOUD_LOCATION}
      - PHOENIX_COLLECTOR_ENDPOINT=http://phoenix:6006/v1/traces
    volumes:
      - ./domains/course_creator/judge:/app/orchestrator
      - ./.env:/app/.env
      - ./agent_platform:/app/agent_platform
      - ./registry:/app/registry
      - ./.agent:/app/.agent

  content_builder:
    container_name: course_creator-content_builder
    build:
      context: .
      dockerfile: agent_platform/Dockerfile.agent
      args:
        AGENT_PATH: domains/course_creator/content_builder
    ports:
      - "8003:8080"
    environment:
      - PORT=8080
      - AGENT_HOST=content_builder
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GOOGLE_GENAI_USE_VERTEXAI=${GOOGLE_GENAI_USE_VERTEXAI}
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT}
      - GOOGLE_CLOUD_LOCATION=${GOOGLE_CLOUD_LOCATION}
      - PHOENIX_COLLECTOR_ENDPOINT=http://phoenix:6006/v1/traces
    volumes:
      - ./domains/course_creator/content_builder:/app/orchestrator
      - ./.env:/app/.env
      - ./agent_platform:/app/agent_platform
      - ./registry:/app/registry
      - ./.agent:/app/.agent

  image_generator:
    container_name: course_creator-image_generator
    build:
      context: .
      dockerfile: agent_platform/Dockerfile.agent
      args:
        AGENT_PATH: domains/course_creator/image_generator
    ports:
      - "8004:8080"
    environment:
      - PORT=8080
      - AGENT_HOST=image_generator
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GOOGLE_GENAI_USE_VERTEXAI=${GOOGLE_GENAI_USE_VERTEXAI}
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT}
      - GOOGLE_CLOUD_LOCATION=${GOOGLE_CLOUD_LOCATION}
      - PHOENIX_COLLECTOR_ENDPOINT=http://phoenix:6006/v1/traces
    volumes:
      - ./domains/course_creator/image_generator:/app/image_generator
      - ./.env:/app/.env
      - ./agent_platform:/app/agent_platform
      - ./registry:/app/registry
      - ./.agent:/app/.agent
    command: [ "uvicorn", "image_generator.server:app", "--host", "0.0.0.0", "--port", "8080" ]

  customer_service:
    container_name: course_creator-customer_service
    build:
      context: .
      dockerfile: agent_platform/Dockerfile.agent
      args:
        AGENT_PATH: domains/course_creator/customer_service
    ports:
      - "8005:8080"
    environment:
      - PORT=8080
      - AGENT_HOST=customer_service
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GOOGLE_GENAI_USE_VERTEXAI=${GOOGLE_GENAI_USE_VERTEXAI}
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT}
      - GOOGLE_CLOUD_LOCATION=${GOOGLE_CLOUD_LOCATION}
      - PHOENIX_COLLECTOR_ENDPOINT=http://phoenix:6006/v1/traces
    volumes:
      - ./domains/course_creator/customer_service:/app/orchestrator
      - ./.env:/app/.env
      - ./agent_platform:/app/agent_platform
      - ./registry:/app/registry
      - ./.agent:/app/.agent

  phoenix:
    container_name: course_creator-phoenix
    image: arizephoenix/phoenix:latest
    ports:
      - "6006:6006" # UI
      - "4317:4317" # OTLP gRPC
    environment:
      - PHOENIX_PORT=6006
