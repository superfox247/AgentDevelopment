# YAML anchors for common configuration
x-common-env: &common-env
  GEMINI_API_KEY: ${GEMINI_API_KEY}
  GOOGLE_GENAI_USE_VERTEXAI: ${GOOGLE_GENAI_USE_VERTEXAI}
  GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT}
  GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION}
  PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:6006/v1/traces

x-common-volumes: &common-volumes
  - ./agent_platform:/app/agent_platform
  - ./.agent:/app/.agent

x-common-build: &common-build
  context: .
  dockerfile: agent_platform/Dockerfile.agent

x-common-resources: &common-resources
  limits:
    cpus: '2'
    memory: 4G
  reservations:
    cpus: '0.5'
    memory: 512M

x-common-healthcheck: &common-healthcheck
  test: ["CMD", "curl", "-f", "http://localhost:8080/"] || exit 1
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 40s

services:
  # NOTE: Previous services (orchestrator, researcher, judge, content_builder, 
  # image_generator, customer_service) that referenced domains/content_creation/ 
  # have been removed as part of the migration from domains/ to agents/ structure.
  # 
  # To add agents to Docker stack:
  # 1. Create agent in agents/<agent_name>/
  # 2. Add service below following this pattern:
  #
  #   <agent_name>:
  #     container_name: <agent_name>
  #     build:
  #       <<: *common-build
  #       args:
  #         AGENT_PATH: agents/<agent_name>
  #     ports:
  #       - "<port>:8080"
  #     environment:
  #       <<: *common-env
  #       PORT: "8080"
  #       AGENT_HOST: <agent_name>
  #     volumes:
  #       - ./agents/<agent_name>:/app/<agent_name>
  #       <<: *common-volumes
  #     healthcheck:
  #       <<: *common-healthcheck
  #     deploy:
  #       resources:
  #         <<: *common-resources

  phoenix:
    container_name: content_creation-phoenix
    image: arizephoenix/phoenix:latest
    ports:
      - "6006:6006" # UI
      - "4317:4317" # OTLP gRPC
    environment:
      PHOENIX_PORT: "6006"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6006/health"] || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '0.25'
          memory: 256M
