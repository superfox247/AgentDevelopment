[pytest]
env =
    GEMINI_API_KEY=fake-key-from-pytest-ini
    GOOGLE_CLOUD_PROJECT=fake-project-from-pytest-ini
    GOOGLE_GENAI_USE_VERTEXAI=false
    AGENT_HOST=localhost
    OTEL_SDK_DISABLED=true
pythonpath = .
testpaths = agent_platform agents frontend
# Include frontend Python tests (routers, utils, models) but exclude frontend/src (TypeScript)
norecursedirs = frontend/src frontend/node_modules
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore:.*\[EXPERIMENTAL\].*:UserWarning
    ignore:.*Support for class-based `config` is deprecated.*:DeprecationWarning
    ignore:.*deprecated.*:DeprecationWarning:google.adk
    ignore:.*is not a valid.*:UserWarning:google.genai
