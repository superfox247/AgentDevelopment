[project]
name = "agent-platform"
version = "0.1.0"
description = "Shared Platform Layer for AI Agents"
requires-python = ">=3.11,<3.13"
dependencies = [
    "google-adk>=1.22.1",
    "fastapi>=0.115.0,<0.124.0",
    "uvicorn>=0.34.0",
    "a2a-sdk>=0.3.20",
    "google-cloud-logging>=3.12.0",

    # Observability Stack
    "arize-phoenix>=4.0.0",
    "arize-phoenix-otel>=0.14.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp>=1.20.0",
    "openinference-instrumentation-google-adk>=0.1.8",
    "opentelemetry-instrumentation-google-genai",
    "opentelemetry-instrumentation-logging",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
