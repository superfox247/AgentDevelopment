apiVersion: deploy.cloud.google.com/v1
kind: DeliveryPipeline
metadata:
  name: __PIPELINE_NAME__
description: Antigravity dashboard progressive delivery pipeline
serialPipeline:
  stages:
    - targetId: staging
      profiles:
        - staging
    - targetId: production
      profiles:
        - production
---
apiVersion: deploy.cloud.google.com/v1
kind: Target
metadata:
  name: staging
description: Staging Cloud Run target
run:
  location: projects/__PROJECT_ID__/locations/__REGION__
---
apiVersion: deploy.cloud.google.com/v1
kind: Target
metadata:
  name: production
description: Production Cloud Run target
requireApproval: true
run:
  location: projects/__PROJECT_ID__/locations/__REGION__
