# Domain Definition Template
# Location: domains/<domain_name>/domain.yaml

name: "example_domain"
version: "0.1.0"
owner: "team-name"
description: "A brief description of what this domain provides."

capabilities:
  - "capability_1"
  - "capability_2"

dependencies:
  # Platform services this domain requires
  platform:
    - "auth"
    - "observability"
  
  # External services or other domains (use sparingly)
  external: []

config:
  # Default configuration for this domain
  timeout_seconds: 30
  max_retries: 3
