name: _template
description: Template for new products - copy and customize

stack:
  - python  # or typescript, react, etc.

paths:
  root: path/to/product
  src: path/to/product/src
  tests: path/to/product/tests

config:
  # Product-specific configuration
  key: value

skills:
  develop: null  # null = use platform default
  test: null     # or path to product-specific skill
